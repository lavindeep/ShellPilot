[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shellpilot"
version = "0.1.0"
description = "A local-first AI shell harness for your terminal, powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lavindeep Dhillon", email = "lavindeepdhillon@gmail.com" }]
keywords = ["ai", "cli", "ollama", "shell", "local-first", "assistant"]
dependencies = ["rich>=13.7", "httpx>=0.27", "platformdirs>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
shellpilot = "shellpilot.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
